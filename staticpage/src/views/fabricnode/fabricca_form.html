<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>营商环境评价分析系统</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="../../uim/layui/css/layui.css" media="all">
    <link rel="stylesheet" href="../../uim/style/admin.css" media="all">
</head>

<style>
    .layui-form[wid100] .layui-form-label {
        width: 15%;
    }
</style>
<body>

<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-header">更新组织中的CA服务器</div>
        <div class="layui-card-body" style="padding: 15px;">
            <form class="layui-form" wid100 action="" lay-filter="LAY-fabricca-form" id="LAY-fabricca-form" style="padding: 20px 30px 0 0;">
                <input type="text" name="pkid" class="layui-input  layui-hide">
                <input type="text" name="checkv" class="layui-input  layui-hide">


                <div class="layui-form-item">
                    <label class="layui-form-label">组织名称</label>
                    <div class="layui-col-md6">
                        <input type="text" name="org_name" placeholder="请输入组织名称" autocomplete="off" class="layui-input">
                    </div>
                </div>


                <div class="layui-form-item">
                    <label class="layui-form-label">ca名称</label>
                    <div class="layui-col-md6">
                        <input type="text" name="ca_name" placeholder="请输入ca名称" autocomplete="off" class="layui-input">
                    </div>
                </div>


                <div class="layui-form-item">
                    <label class="layui-form-label">ca请求路径</label>
                    <div class="layui-col-md6">
                        <input type="text" name="ca_request" placeholder="请输入ca请求路径" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>


                <div class="layui-form-item">
                    <label class="layui-form-label">ca配置文件路径</label>
                    <div class="layui-col-md6">
                        <input type="text" name="ca_config_path" placeholder="请输入ca配置文件路径" autocomplete="off" class="layui-input">
                    </div>
                </div>


                <div class="layui-form-item">
                    <label class="layui-form-label">运行方式</label>
                    <div class="layui-col-md6">
                        <input type="text" name="runtype" placeholder="请输入运行方式(0-bin 1-docker)" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>


                <div class="layui-form-item">
                    <label class="layui-form-label">docker镜像名称</label>
                    <div class="layui-col-md6">
                        <input type="text" name="docker_images" placeholder="请输入docker镜像名称" autocomplete="off" class="layui-input">
                    </div>
                </div>


                <div class="layui-form-item">
                    <label class="layui-form-label">docker镜镜像配置信息</label>
                    <div class="layui-col-md6">
                        <textarea name="docker_images_config" id="docker_images_config" autocomplete="off"
                                  class="layui-textarea"></textarea>
                    </div>
                </div>



                <div class="layui-form-item">
                    <label class="layui-form-label">运行服务器</label>
                    <div class="layui-col-md6">
                        <input type="text" name="server_ipaddress" placeholder="请输入运行服务器" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>


                <div class="layui-form-item">
                    <label class="layui-form-label">content地址</label>
                    <div class="layui-col-md6">
                        <input type="text" name="docker_ipaddress" placeholder="请输入content地址" autocomplete="off" class="layui-input">
                    </div>
                </div>


                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-col-md6">
                        <textarea name="remark" id="remark" autocomplete="off" class="layui-textarea"></textarea>
                    </div>
                </div>



                <div class="layui-form-item layui-hide">
                    <input type="button" lay-submit lay-filter="layuiadmin-fabricca-form-submit"
                           id="layuiadmin-fabricca-form-submit" alue="保存">
                </div>
            </form>
        </div>
    </div>
</div>

<script src="../../uim/layui/layui.js"></script>
<script>
    layui.config({
        base: '../../uim/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'fabricnode'], function () {

        var fabricnode = layui.fabricnode;
        fabricnode.fabricca_form();

    })
</script>

</body>
</html>
