<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>营商环境评价分析系统</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="../../uim/layui/css/layui.css" media="all">
    <link rel="stylesheet" href="../../uim/style/admin.css" media="all">
</head>
<body>

<div class="layui-fluid">

    <div class="layui-card">

        <div class="layui-form layui-card-header layuiadmin-card-header-auto">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">名称</label>
                    <div class="layui-input-inline">
                        <input type="text" name="id" placeholder="请输入" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-row">
                <div class="layui-col-md9">
                    <div style="padding-bottom: 1px;">
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div style="padding-bottom: 1px;text-align: right">
                        <button class="layui-btn layuiadmin-btn-list" lay-submit lay-filter="LAY-peer-search">
                            <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>
                        </button>
                        <button type="reset" class="layui-btn layuiadmin-btn-list" lay-filter="LAY-app-contlist-reset">重置</button>
                    </div>
                </div>
            </div>
        </div>


        <div class="layui-card-body">
            <div style="padding-bottom: 10px;">
                <button class="layui-btn layuiadmin-btn-list" data-type="add">添加</button>
                <button class="layui-btn layuiadmin-btn-list" data-type="batchdel">批量删除</button>
                <!--<button class="layui-btn layuiadmin-btn-list" data-type="batchcheck">审核</button>-->
            </div>

            <table id="LAY-peer-list" lay-filter="LAY-peer-list"></table>
            <script type="text/html" id="runtypeTpl">
                {{#  if(d.runtype==0){ }}
                <button class="layui-btn layui-btn-xs" lay-event="public">原生</button>
                {{#  } else { }}
                <button class="layui-btn layui-btn-primary layui-btn-xs" lay-event="premodify">Docker</button>
                {{#  } }}
            </script>
            <script type="text/html" id="table-content-list">
                <a class="layui-btn layui-btn-xs" lay-event="detail">详情</a>
                <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit">编辑</a>
                <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
            </script>
        </div>

    </div>

</div>

<script src="../../uim/layui/layui.js"></script>
<script>

    layui.config({
        base: '../../uim/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index' , 'fabricnode'], function () {

        var fabricnode = layui.fabricnode;
        fabricnode.peer_list();

    });
</script>
</body>
</html>
