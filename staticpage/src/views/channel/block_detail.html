<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>组织明细</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="../../uim/layui/css/layui.css" media="all">
    <link rel="stylesheet" href="../../uim/style/admin.css" media="all">
    <link rel="stylesheet" href="../../source/vis/vis.min.css" media="all">
    <link rel="stylesheet" type="text/css" href="../../source/json/s.css" rel="stylesheet">
</head>
<body>

<style>
    .layui-col-md2 {
        width: 25%
    }
    .layadming-big-font-detailshow{text-align:-webkit-center}
</style>

<div class="layui-fluid" id="LAY-component-grid-all">

    <div class="layui-row layui-col-space10">

        <div class="layui-col-xs6 layui-col-sm7 layui-col-md12">
            <!-- 填充内容 -->
            <div class="layui-card">

                <div class="layui-card-body">
                    <table class="layui-table">
                        <colgroup>
                            <col width="8%">
                            <col width="10%">
                            <col width="8%">
                            <col width="36%">
                            <col width="8%">
                            <col width="15%">
                            <col width="8%">
                            <col width="15%">
                        </colgroup>
                        <tbody>
                        <tr>
                            <td>编号</td>
                            <td><button class="layui-btn layuiadmin-btn-list layui-btn-sm" data-type="view_org_cert"><p class="layuiadmin-big-font layadming-big-font-detailshow" id="blocknum_div_element"></p></button></td>
                            <td>HASH</td>
                            <td><p class="layuiadmin-big-font layadming-big-font-detailshow" id="blockhash_div_element"></p></td>
                            <td>时间</td>
                            <td><p class="layuiadmin-big-font layadming-big-font-detailshow" id="blockcreatedt_div_element"></p></td>
                            <td>channel</td>
                            <td><p class="layuiadmin-big-font layadming-big-font-detailshow" id="blockchannel_div_element"></p></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>


    <div class="layui-row layui-col-space10">

        <div class="layui-col-xs6 layui-col-sm7 layui-col-md4">
            <!-- 填充内容 -->
            <div class="layui-card">
                <div class="layui-card-header">
                    共享区块的组织
                    <span class="layui-badge layui-bg-blue layuiadmin-badge">个</span>
                </div>
                <div class="layui-card-body layuiadmin-card-list">
                    <p class="layuiadmin-big-font" style="text-align:-webkit-center;color:#009688"><cite id="divelementorg">8</cite></p>
                </div>
            </div>
        </div>


        <div class="layui-col-xs6 layui-col-sm7 layui-col-md4">
            <!-- 填充内容 -->
            <div class="layui-card">
                <div class="layui-card-header">
                    保存区块的peer节点
                    <span class="layui-badge layui-bg-blue layuiadmin-badge">个</span>
                </div>
                <div class="layui-card-body layuiadmin-card-list">
                    <p class="layuiadmin-big-font" style="text-align:-webkit-center;color:#009688"><cite id="divelementpeer">8</cite></p>
                </div>
            </div>
        </div>

        <div class="layui-col-xs6 layui-col-sm7 layui-col-md4">
            <!-- 填充内容 -->
            <div class="layui-card">
                <div class="layui-card-header">
                    交易
                    <span class="layui-badge layui-bg-blue layuiadmin-badge">个</span>
                </div>
                <div class="layui-card-body layuiadmin-card-list">
                    <p class="layuiadmin-big-font" style="text-align:-webkit-center;color:#009688"><cite id="divelementtx">8</cite></p>
                </div>
            </div>
        </div>



    </div>


    <div class="layui-row layui-col-space10">

        <div class="layui-col-xs6 layui-col-sm7 layui-col-md12">
            <!-- 填充内容 -->
            <div class="layui-card">

                <div class="layui-card-body">
                    <div class="layui-tab layui-tab-card" lay-filter="component-tabs-brief">
                        <ul class="layui-tab-title">

                            <li class="layui-this">区块结构图</li>
                            <li>区块结构明细</li>
                            <li>区块中的交易</li>
                            <li>区块中的keyset</li>
                            <!--
                            <li>区块中的签名</li>
                            -->
                        </ul>


                        <div class="layui-tab-content">


                            <!--  网络架构图 -->
                            <div class="layui-tab-item layui-show">

                                <div class="layui-row layui-col-space10">

                                    <div class="layui-col-xs6 layui-col-sm7 layui-col-md12">
                                        <!-- 填充内容 -->
                                        <div class="layui-card">
                                            <div class="layui-card-body">

                                                <div class="layui-row">
                                                    <div class="layui-col-xs1">
                                                        <div id="pic_example" style="width: 500px;height: 600px;"></div>
                                                    </div>
                                                    <div class="layui-col-xs11">
                                                        <div id="pic_struct" style=" width: 98%;height: 600px;border:1px solid #f2f2f2"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                            </div>

                            <!-- 区块详细信息 -->
                            <div class="layui-tab-item">

                                <div id="Canvas" class="Canvas" style="overflow-y:auto; overflow-x:auto; height:500px;"><pre id="Canvasper" class="layui-code"></pre></div>

                            </div>

                            <!-- 交易 -->
                            <div class="layui-tab-item" lay-data=" event 3">

                                <div class="layui-card">
                                    <div class="layui-form layui-card-header layuiadmin-card-header-auto">
                                        <div class="layui-form-item">
                                            <div class="layui-inline">
                                                <label class="layui-form-label">名称</label>
                                                <div class="layui-input-inline">
                                                    <input type="text" name="id" placeholder="请输入" autocomplete="off" class="layui-input">
                                                </div>
                                            </div>
                                            <div class="layui-inline">
                                                <div style="padding-bottom: 1px;text-align: right">
                                                    <button class="layui-btn layuiadmin-btn-list" lay-submit lay-filter="LAY-transaction-search">
                                                        <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="layui-card-body"><table id="LAY-transaction-list" lay-filter="LAY-transaction-list"></table></div>
                                </div>



                            </div>

                            <!-- keyset 列表 -->
                            <div class="layui-tab-item" lay-data=" event 4">


                                <div class="layui-card">
                                    <div class="layui-form layui-card-header layuiadmin-card-header-auto">
                                        <div class="layui-form-item">
                                            <div class="layui-inline">
                                                <label class="layui-form-label">名称</label>
                                                <div class="layui-input-inline">
                                                    <input type="text" name="id" placeholder="请输入" autocomplete="off" class="layui-input">
                                                </div>
                                            </div>
                                            <div class="layui-inline">
                                                <div style="padding-bottom: 1px;text-align: right">
                                                    <button class="layui-btn layuiadmin-btn-list" lay-submit lay-filter="LAY-keyset-search">
                                                        <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="layui-card-body">
                                        <table id="LAY-keyset-list" lay-filter="LAY-keyset-list"></table>
                                    </div>
                                </div>


                            </div>

                            <!-- account  -->
                            <div class="layui-tab-item">

                                <div class="layui-card">

                                    <div class="layui-form layui-card-header layuiadmin-card-header-auto">
                                        <div class="layui-form-item">
                                            <div class="layui-inline">
                                                <label class="layui-form-label">名称</label>
                                                <div class="layui-input-inline">
                                                    <input type="text" name="id" placeholder="请输入" autocomplete="off" class="layui-input">
                                                </div>
                                            </div>
                                            <div class="layui-inline">
                                                <div style="padding-bottom: 1px;text-align: right">
                                                    <button class="layui-btn layuiadmin-btn-list" lay-submit lay-filter="LAY-accounts-search">
                                                        <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="layui-card-body">
                                        <table id="LAY-accounts-list" lay-filter="LAY-accounts-list"></table>
                                    </div>

                                </div>


                            </div>


                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>


</div>



<script src="../../source/json/m.js" type="text/javascript"></script>
<script src="../../source/json/c1.js" type="text/javascript"></script>
<script src="../../source/vis/vis.min.js" type="text/javascript"></script>


<script>

    window.visobj = vis;

</script>

<script src="../../uim/layui/layui.js"></script>
<script>

    layui.config({
        base: '../../uim/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'channel'], function () {
        var channel = layui.channel;
        channel.block_detail();
    });

</script>

</body>
</html>
