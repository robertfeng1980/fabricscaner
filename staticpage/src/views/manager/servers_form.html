<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>营商环境评价分析系统</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="../../uim/layui/css/layui.css" media="all">
    <link rel="stylesheet" href="../../uim/style/admin.css" media="all">
</head>
<body>

<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-header">更新网络中的服务器</div>
        <div class="layui-card-body" style="padding: 15px;">
            <form class="layui-form" wid100 action=""  lay-filter="LAY-servers-form" id="LAY-servers-form"  style="padding: 20px 30px 0 0;">
                <input type="text" name="pkid"  class="layui-input  layui-hide">
                <input type="text" name="checkv"  class="layui-input  layui-hide">



                    <div class="layui-form-item">
                        <label class="layui-form-label">IP地址</label>
                        <div class="layui-col-md6">
                            <input type="text" name="ipaddress" placeholder="请输入IP地址" autocomplete="off" class="layui-input">
                        </div>
                    </div>





                    <div class="layui-form-item">
                        <label class="layui-form-label">docker服务端口</label>
                        <div class="layui-col-md6">
                            <input type="text" name="docker_service_port" placeholder="请输入docker服务端口" autocomplete="off" class="layui-input">
                        </div>
                    </div>





                    <div class="layui-form-item">
                        <label class="layui-form-label">服务器名称</label>
                        <div class="layui-col-md6">
                            <input type="text" name="name" placeholder="请输入服务器名称" autocomplete="off" class="layui-input">
                        </div>
                    </div>





                        <div class="layui-form-item">
                            <label class="layui-form-label">备注</label>
                            <div class="layui-input-inline">
                                <textarea name="remark" id="remark"  style="width: 400px; height: 150px;" autocomplete="off"></textarea>
                            </div>
                        </div>





                <div class="layui-form-item layui-hide">
                    <input type="button" lay-submit lay-filter="layuiadmin-servers-form-submit" id="layuiadmin-servers-form-submit" alue="保存">
                </div>
            </form>
        </div>
    </div>
</div>

<script src="../../uim/layui/layui.js"></script>
<script>
    layui.config({
        base: '../../uim/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'manager'], function () {

        var manager = layui.manager;
        manager.servers_form();

    })
</script>

</body>
</html>
